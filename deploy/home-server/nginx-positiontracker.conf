    # ===== PositionTracker: static site at /tracker/, application at /tracker/app/ (stack positiontracker) =====
    #
    # Needs, in the http context (before this server block):
    #
    #   # The client address. CF-Connecting-IP is believed only from the Cloudflare tunnel (container lab463-tunnel on the docker
    #   # network frontend, 172.30.0.0/24); the port this nginx publishes on the host (8081) is reachable from the LAN as well, and
    #   # there the header is whatever the client sends, so it would let anyone pick a new address per request and walk past every
    #   # per-IP limit. Docker's gateway (.1) is the host itself (traffic through the published port), never the tunnel.
    #   geo $pt_via_tunnel { default 0; 172.30.0.0/24 1; 172.30.0.1 0; }
    #   map "$pt_via_tunnel:$http_cf_connecting_ip" $pt_client_ip { default $remote_addr; "~^1:(?<pt_cf>.+)$" $pt_cf; }
    #
    #   # Per client: requests to the application (generous: a start line of phones can share one mobile-carrier address) and
    #   # open connections (each spectator holds one WebSocket).
    #   limit_req_zone $pt_client_ip zone=pt_req:10m rate=50r/s;
    #   limit_conn_zone $pt_client_ip zone=pt_conn:10m;
    #   limit_req_status 429;
    #   limit_conn_status 429;
    #
    #   # Micro-cache of the anonymous public answers of an event (/public, /course, /info, /public-results), keyed without the query
    #   # string (they take none), so "?x=<random>" cannot bypass the cache.
    #   proxy_cache_path /var/cache/nginx/pt levels=1:2 keys_zone=pt_micro:2m max_size=20m inactive=1m use_temp_path=off;
    #   map $uri $pt_nocache { default 1; "~^/tracker/app/api/events/[^/]+/(public|course|info|public-results)$" 0; }
    #
    # and, for the access log, the maps $log_uri_path / $log_uri / $log_referer that mask token= values (see docs/ops/deployment-home-server.md).
    location = /tracker {
        return 301 /tracker/;
    }
    location = /tracker/app {
        return 301 /tracker/app/;
    }

    # Creating an event (POST /api/events, no trailing slash): without this exact location the prefix location below would answer
    # it with nginx's automatic 301 to /api/events/, which the browser follows as a GET (the new event page opened as .../undefined).
    location = /tracker/app/api/events {
        proxy_pass http://positiontracker/api/events;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $pt_client_ip;
        proxy_set_header X-Forwarded-For $pt_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cookie_path / /tracker/app/;
        client_max_body_size 3m;
        proxy_read_timeout 60s;
        limit_req zone=pt_req burst=100 nodelay;
        limit_conn pt_conn 100;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # The public answers of an event (/public, /course, /info, /public-results) are cached for 2 s, so many spectators polling cost the
    # app one request per 2 s; everything else under /api/events/ is never cached ($pt_nocache, see the top of this snippet).
    location ^~ /tracker/app/api/events/ {
        proxy_pass http://positiontracker/api/events/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $pt_client_ip;
        proxy_set_header X-Forwarded-For $pt_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cookie_path / /tracker/app/;
        client_max_body_size 3m;
        proxy_read_timeout 60s;
        limit_req zone=pt_req burst=100 nodelay;
        limit_conn pt_conn 100;
        proxy_cache pt_micro;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$host$uri";
        proxy_cache_valid 200 2s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        proxy_ignore_headers Cache-Control Expires;
        proxy_no_cache $pt_nocache;
        proxy_cache_bypass $pt_nocache;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # The application (prefix stripped; the web app is built with base /tracker/app/). The client address comes from Cloudflare.
    # Defining add_header here stops the inheritance of the server-level headers: the app sends its own CSP, X-Frame-Options and so on.
    location ^~ /tracker/app/ {
        proxy_pass http://positiontracker/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $pt_client_ip;
        proxy_set_header X-Forwarded-For $pt_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cookie_path / /tracker/app/;
        client_max_body_size 3m;
        proxy_read_timeout 60s;
        limit_req zone=pt_req burst=100 nodelay;
        limit_conn pt_conn 100;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ===== Performance report /tracker/perf/ in Slovak or English (perf/report/build.py writes index.sk.html, index.en.html, the
    # hashed assets and a .gz of each). /tracker/perf/ picks the language by the pt_lang cookie (the page's SK|EN switch), else by the
    # first language of Accept-Language (Slovak -> sk, anything else -> en), without a redirect. Needs, in the http context:
    #   map "$cookie_pt_lang:$http_accept_language" $pt_perf_lang {
    #       "~^sk:" sk;  "~^en:" en;  "~*^:\s*sk([-;,]|$)" sk;  default en;
    #   }
    # Exact locations only: a regex location is never consulted under the ^~ /tracker/ prefix below.
    location = /tracker/perf { return 301 /tracker/perf/; }
    location = /tracker/perf/index.html { return 301 /tracker/perf/; }
    location = /tracker/perf/ {
        gzip_static on;
        try_files /tracker/perf/index.$pt_perf_lang.html =404;
        add_header Vary "Accept-Language, Cookie" always;
        add_header Content-Language $pt_perf_lang always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }
    location = /tracker/perf/sk/ {
        gzip_static on;
        try_files /tracker/perf/index.sk.html =404;
        add_header Content-Language sk always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }
    location = /tracker/perf/en/ {
        gzip_static on;
        try_files /tracker/perf/index.en.html =404;
        add_header Content-Language en always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }
    # assets carry a content hash in the file name: cached for good, served precompressed
    location ^~ /tracker/perf/assets/ {
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    # The marketing site (static files in site/tracker/)
    # build.py puts a content hash in the query string of every asset (?v=...), so those are cached for good; the HTML (no ?v) is
    # revalidated. In Cloudflare set Browser Cache TTL to "Respect Existing Headers", otherwise it overrides this with 4 hours.
    location ^~ /tracker/ {
        try_files $uri $uri/ =404;
        set $pt_cache "no-cache";
        if ($arg_v) { set $pt_cache "public, max-age=31536000, immutable"; }
        add_header Cache-Control $pt_cache always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

