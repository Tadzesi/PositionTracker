    # ===== PositionTracker: static site at /tracker/, application at /tracker/app/ (stack positiontracker) =====
    location = /tracker {
        return 301 /tracker/;
    }
    location = /tracker/app {
        return 301 /tracker/app/;
    }

    # The application (prefix stripped; the web app is built with base /tracker/app/). The client address comes from Cloudflare.
    # Defining add_header here stops the inheritance of the server-level headers: the app sends its own CSP, X-Frame-Options and so on.
    location ^~ /tracker/app/ {
        proxy_pass http://positiontracker/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cookie_path / /tracker/app/;
        client_max_body_size 3m;
        proxy_read_timeout 60s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # The marketing site (static files in site/tracker/)
    location ^~ /tracker/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

