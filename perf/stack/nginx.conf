# nginx of the load-test stack: proxies to the app and logs the server-side timing of every request (CSV).
# X-T carries the server clock ($msec) so the generator can estimate the clock offset between the two machines.
worker_processes 2;
events { worker_connections 16384; }

http {
    map $uri $uri_class {
        ~/positions$  pos;
        ~^/hubs/      hub;
        default       other;
    }
    log_format perf escape=none '$msec,$request_time,$upstream_response_time,$upstream_connect_time,$status,$uri_class,$bytes_sent,$request_length,$connection,$connection_requests';
    access_log /var/log/pt/access.csv perf buffer=256k flush=1s;
    error_log /var/log/pt/error.log warn;

    keepalive_requests 1000000;
    keepalive_timeout 300s;

    upstream app {
        server app:8080;
        keepalive 256;
    }

    server {
        listen 80;
        add_header X-T $msec always;

        location /hubs/ {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
