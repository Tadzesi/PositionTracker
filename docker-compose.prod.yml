# Production example: the API (with the web app) and its PostgreSQL. Put a reverse proxy with HTTPS in front
# (see docs/ops/deployment.md). Every secret comes from the environment / an .env file that is NOT committed.
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    environment:
      POSTGRES_DB: positiontracker
      POSTGRES_USER: positiontracker
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - pt-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U positiontracker -d positiontracker"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]
    # Bounds on a 2-core home server shared with other stacks: a runaway query or a flood cannot starve the rest.
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]

  app:
    build:
      context: .
      args:
        VITE_BASE: ${VITE_BASE:-/}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=positiontracker;Username=positiontracker;Password=${DB_PASSWORD}"
      Persistence__MigrateOnStartup: "true"
      Organizer__ApiKey: ${ORGANIZER_API_KEY:?set ORGANIZER_API_KEY}
      Email__PublicBaseUrl: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL, e.g. https://tracker.example.org}
      Email__From: ${MAIL_FROM:?set MAIL_FROM}
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__User: ${SMTP_USER:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__AllowSimulated: ${ALLOW_SIMULATED_EMAIL:-false}
      Accounts__DataProtectionKeysPath: /keys
      Accounts__RateLimitSalt: ${RATE_LIMIT_SALT:?set RATE_LIMIT_SALT}
      Admin__Emails: ${ADMIN_EMAILS:-}
      # The reverse proxy's address(es) as the app sees them: the client address is taken from X-Forwarded-For only from these.
      Proxy__KnownNetworks__0: ${PROXY_NETWORK:-172.16.0.0/12}
      Retention__FixDays: "30"
    volumes:
      - pt-keys:/keys
    # The app runs as a non-root user and needs no capability; its file system is read-only except /keys (volume) and /tmp.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 512
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    networks: [internal]

volumes:
  pt-db:
  pt-keys:

networks:
  internal:
